<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Drum Time! 🥁</title>
<meta name="description" content="A super-simple, interactive drum machine for teaching kids rhythm." />
<meta name="theme-color" content="#ff8c42" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<!-- iOS: run full-screen like a real app when added to Home Screen -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Drum Time" />
<style>
  :root{
    --bg1:#fef6e4; --bg2:#e0f4ff; --ink:#2b2d42; --panel:#ffffff;
    --hihat:#ffd23f;  --hihat-d:#e6b800;
    --openhat:#ff9f1c;--openhat-d:#e07b00;
    --snare:#ff6b6b;  --snare-d:#e63946;
    --tom1:#6fdcb4;   --tom1-d:#2fa583;
    --tom2:#43c59e;   --tom2-d:#24936f;
    --ftom:#1f9a74;   --ftom-d:#14704f;
    --bass:#7b6cf6;   --bass-d:#5a4ad1;
    --clap:#ff7ad9;   --clap-d:#e055bd;
    --cowbell:#2ec4d6;--cowbell-d:#1fa6b6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Comic Sans MS","Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;gap:7px;
    padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  }
  h1{margin:0;font-size:clamp(14px,2.2vw,22px);text-align:center;letter-spacing:1px;line-height:1;}

  /* ---------- GRID (the main playing bar — gets all leftover space) ---------- */
  .gridwrap{flex:1;min-height:0;background:var(--panel);border-radius:22px;
    box-shadow:0 8px 24px rgba(0,0,0,.10);padding:10px;display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .grid{flex:1;display:grid;gap:6px;min-height:0;}
  /* let 1fr rows actually shrink when many drums are on a short screen */
  .grid>*{min-height:0;min-width:0;overflow:hidden;}
  .grid>.beatnum{overflow:visible;}   /* so "Bar 2" isn't clipped by its column */
  .label{display:flex;flex-direction:row;align-items:center;gap:5px;padding-left:4px;font-weight:bold;border-radius:14px;}
  .label .labtext{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .label .name{font-size:clamp(13px,2vw,24px);line-height:1.05;}
  .label .word{font-size:clamp(11px,1.5vw,17px);opacity:.7;}
  /* hi-hat brush: picks whether a tap puts down a closed or an open hat */
  .label.hihat{flex-wrap:wrap;align-content:center;padding-right:3px;}
  /* the brush already shows ✨, so the name drops it and stays on one line */
  .label.hihat .labtext{flex:1 1 0;}
  .label.hihat .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(12px,1.7vw,21px);}
  /* own line under mute+name, so it gets the label's full width */
  .brush{flex:1 0 100%;display:flex;gap:3px;}
  .brush button{flex:1 1 0;min-width:0;min-height:24px;overflow:hidden;border:2px solid transparent;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:bold;
    font-size:clamp(13px,1.6vw,18px);padding:1px 3px;line-height:1.15;white-space:nowrap;
    background:#f4f5f8;color:var(--ink);opacity:.6;}
  .brush button:active{transform:scale(.92);}
  .brush button.sel{opacity:1;}
  .brush button.sel[data-brush="1"]{background:var(--hihat);border-color:var(--hihat-d);}
  .brush button.sel[data-brush="2"]{background:var(--openhat);border-color:var(--openhat-d);}
  /* per-row mute: the row keeps its pattern, it just makes no sound */
  .mute{flex:0 0 auto;width:25px;height:25px;border-radius:50%;border:none;cursor:pointer;
    background:#eef0f4;font-size:13px;line-height:1;padding:0;color:var(--ink);}
  .mute:active{transform:scale(.9);}
  /* wipes every beat; lives in the grid's empty corner so it is always on screen
     and sits right next to the pattern it clears */
  .gridclear{width:100%;border:none;border-radius:10px;cursor:pointer;background:#ffe5e5;color:#c1121f;
    font-family:inherit;font-weight:bold;font-size:clamp(10px,1.25vw,13px);white-space:nowrap;padding:5px 3px;}
  .gridclear:active{transform:scale(.94);}
  body.locked .gridclear{opacity:.4;pointer-events:none;}
  .mute.on{background:#ffd6d6;}
  .label.muted .labtext{opacity:.4;}
  .cell.muted{opacity:.34;filter:grayscale(.75);}
  .grid.dense .mute{width:22px;height:22px;font-size:11px;}
  .grid.superdense .mute{width:19px;height:19px;font-size:10px;}
  .label.hihat{color:var(--hihat-d);} .label.snare{color:var(--snare-d);}
  .label.tom1{color:var(--tom1-d);} .label.tom2{color:var(--tom2-d);} .label.ftom{color:var(--ftom-d);}
  .label.bass{color:var(--bass-d);}
  .label.clap{color:var(--clap-d);} .label.cowbell{color:var(--cowbell-d);}

  .cell{border:none;border-radius:14px;background:#eef0f4;cursor:pointer;position:relative;
    transition:transform .06s ease, background .12s ease;
    display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4.5vw,46px);}
  .cell:active{transform:scale(.93);}
  .cell.on.hihat{background:var(--hihat);}
  .cell.on.open.hihat{background:var(--openhat);}   /* same row, open state */
  .cell.on.snare{background:var(--snare);}
  .cell.on.tom1{background:var(--tom1);} .cell.on.tom2{background:var(--tom2);} .cell.on.ftom{background:var(--ftom);}
  .cell.on.bass{background:var(--bass);}
  .cell.on.clap{background:var(--clap);} .cell.on.cowbell{background:var(--cowbell);}
  .cell .dot{opacity:0;font-size:.9em;} .cell.on .dot{opacity:1;}

  /* start of bar 2 — a little air plus a divider line */
  .grid .barstart{margin-left:9px;position:relative;}
  .grid .barstart::before{content:"";position:absolute;left:-6px;top:0;bottom:0;
    border-left:3px dotted rgba(43,45,66,.22);}
  /* lots of columns: shrink the emoji so 16 (or 32) cells still fit */
  .grid.dense{gap:4px;}
  .grid.dense .cell{font-size:clamp(14px,2.6vw,32px);border-radius:11px;}
  .grid.superdense{gap:3px;}
  .grid.superdense .cell{font-size:clamp(9px,1.6vw,20px);border-radius:8px;}
  .grid.superdense .barstart{margin-left:7px;}

  .beatnum{text-align:center;font-weight:bold;font-size:clamp(12px,1.6vw,19px);opacity:.55;align-self:end;padding-bottom:2px;}
  .beatnum.and{opacity:.3;}
  .grid.dense .beatnum{font-size:clamp(10px,1.3vw,16px);}
  .grid.superdense .beatnum{font-size:clamp(9px,1.1vw,14px);}
  .barlabel{font-size:clamp(9px,1.1vw,12px);opacity:.45;font-weight:bold;text-transform:uppercase;
    display:block;line-height:1;white-space:nowrap;text-align:left;}
  /* bar 2's label doubles as a one-tap "wipe this bar" button, so a fill can be
     started again without clearing the groove in bar 1 */
  .beatnum.hasclear{opacity:1;}
  .beatnum.hasclear .num{opacity:.55;}
  .barclear{display:block;border:none;border-radius:8px;cursor:pointer;background:#ffe5e5;color:#c1121f;
    font-family:inherit;font-weight:bold;font-size:clamp(10px,1.2vw,13px);line-height:1.1;white-space:nowrap;
    padding:3px 6px;margin-bottom:2px;}
  .barclear:active{transform:scale(.92);}
  body.locked .barclear{opacity:.4;pointer-events:none;}
  .col-active{box-shadow:0 0 0 4px rgba(43,45,66,.18) inset;}
  .cell.hit{animation:pop .25s ease;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
  .beatnum.col-active{opacity:1;color:var(--ink);transform:scale(1.25);}

  /* big count overlay */
  #countface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:5;}
  #countface span{font-size:clamp(80px,22vw,260px);font-weight:bold;color:rgba(43,45,66,.22);opacity:0;}
  #countface.show span{animation:cpop .5s ease forwards;}
  @keyframes cpop{0%{transform:scale(.6);opacity:0;}25%{transform:scale(1.15);opacity:1;}60%{transform:scale(1);opacity:.8;}100%{transform:scale(1.05);opacity:0;}}

  /* ---------- CONTROLS (compact; one slim scrollable row each) ---------- */
  .controls{display:flex;flex-wrap:nowrap;gap:6px;align-items:stretch;
    overflow-x:auto;overflow-y:hidden;padding:1px 1px 3px;-webkit-overflow-scrolling:touch;}
  .controls::-webkit-scrollbar{height:5px;}
  .controls::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:3px;}
  .controls.hidden{display:none;}
  .panel{flex:0 0 auto;background:var(--panel);border-radius:14px;padding:5px 9px;
    box-shadow:0 3px 9px rgba(0,0,0,.08);display:flex;align-items:center;gap:6px;}
  .panel .cap{font-size:10px;opacity:.5;font-weight:bold;text-transform:uppercase;white-space:nowrap;}
  .btn{border:none;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:bold;white-space:nowrap;transition:transform .08s ease,filter .12s ease;}
  .btn:active{transform:scale(.94);}
  .play{background:#2ec4b6;color:#fff;font-size:clamp(16px,2.2vw,22px);padding:9px 18px;border-radius:16px;box-shadow:0 5px 0 #25a99d;}
  .play.playing{background:#ff8c42;box-shadow:0 5px 0 #e0712a;}
  .step{font-size:22px;width:40px;height:40px;border-radius:50%;background:#eef0f4;color:var(--ink);line-height:1;}
  .bpm-val{font-size:clamp(15px,2vw,21px);font-weight:bold;min-width:78px;text-align:center;white-space:nowrap;}
  .bpm-val small{font-size:.46em;opacity:.6;display:block;}
  input[type=range]{width:clamp(86px,14vw,160px);height:28px;}
  .seg{display:flex;background:#eef0f4;border-radius:12px;padding:3px;gap:3px;}
  .seg button{border:none;background:transparent;border-radius:9px;cursor:pointer;font-family:inherit;
    font-weight:bold;font-size:clamp(12px,1.5vw,15px);padding:6px 9px;color:var(--ink);white-space:nowrap;}
  .seg button.sel{background:#2b2d42;color:#fff;}
  .chip{background:#eef0f4;color:var(--ink);font-size:clamp(11px,1.4vw,14px);padding:6px 8px;border-radius:10px;font-weight:bold;border:none;cursor:pointer;white-space:nowrap;}
  .chip.sel{background:#2b2d42;color:#fff;}
  .song .chip.sel{background:#ffafcc;color:#5a2a45;}
  .shed .chip.sel{background:#bdb2ff;color:#2b2456;}
  .shedinfo{font-size:clamp(12px,1.6vw,16px);font-weight:bold;min-width:62px;text-align:center;white-space:nowrap;line-height:1.15;}
  .shedinfo small{display:block;font-size:.68em;opacity:.55;font-weight:normal;}
  .shedinfo .warn{color:#c1121f;}
  .tapbtn{background:#eef0f4;color:var(--ink);font-size:clamp(11px,1.4vw,14px);padding:7px 9px;border-radius:10px;font-weight:bold;border:none;cursor:pointer;white-space:nowrap;}
  .tapbtn.armed{background:#ffd23f;color:#7a5a00;}
  input[type=range].vol{width:clamp(48px,7vw,84px);}
  .credit{font-size:10px;opacity:.4;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis;}
  .toggle{background:#eef0f4;color:#888;font-size:clamp(12px,1.5vw,15px);padding:6px 10px;}
  .toggle.on{background:#ffe08a;color:#7a5a00;}
  .clear{background:#ffe5e5;color:#c1121f;font-size:clamp(11px,1.4vw,14px);padding:6px 10px;border-radius:10px;}
  .lockbtn{background:#e6e9f0;color:#3a3f5c;font-size:clamp(12px,1.5vw,15px);padding:7px 11px;border-radius:12px;font-weight:bold;border:none;cursor:pointer;white-space:nowrap;}
  .morebtn{background:#eae6ff;color:#5a4ad1;font-size:clamp(12px,1.5vw,15px);padding:7px 11px;border-radius:12px;font-weight:bold;border:none;cursor:pointer;white-space:nowrap;}
  body.locked .lockbtn{background:#ffb703;color:#5a3d00;}
  .slot{width:38px;height:38px;border-radius:10px;background:#eef0f4;border:2px dashed #c7ccd6;color:#9aa1b0;font-weight:bold;cursor:pointer;font-size:16px;position:relative;}
  .slot.filled{border-style:solid;border-color:#2ec4b6;color:#16998c;background:#e6fbf7;}

  /* lock: dim & block everything except .always panels */
  body.locked .panel:not(.always){opacity:.4;pointer-events:none;filter:grayscale(.4);}
  body.locked .gridwrap{pointer-events:none;}

  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;}
  .hint{font-size:11px;opacity:.45;text-align:center;}

  /* ---------- ACADEMY ---------- */
  .acadbtn{background:#ffd23f;color:#5a3d00;font-size:clamp(13px,1.7vw,17px);padding:8px 12px;border-radius:12px;font-weight:bold;border:none;cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 #e6b800;}
  .acadbtn:active{transform:scale(.94);}
  /* mission bar: what the student is being tested on right now, with the teacher's Pass button */
  .mission{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:5px 8px;
    box-shadow:0 3px 9px rgba(0,0,0,.08);font-weight:bold;font-size:clamp(13px,1.8vw,18px);}
  .mission.hidden{display:none;}
  .mission .mbadge{font-size:1.5em;line-height:1;}
  .mission .mtext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mission .mrule{font-size:.7em;opacity:.55;white-space:nowrap;}
  .mission button{border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:bold;font-size:clamp(13px,1.6vw,16px);padding:7px 10px;background:#eef0f4;color:var(--ink);white-space:nowrap;}
  .mission button.mpass{background:#2ec4b6;color:#fff;box-shadow:0 3px 0 #25a99d;}
  .mission button.mpass.on{background:#ffd23f;color:#5a3d00;box-shadow:0 3px 0 #e6b800;}
  body.locked .mission button.mpass{opacity:.4;}

  .academy{position:fixed;inset:0;z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));user-select:none;
    padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));}
  .academy.hidden{display:none;}
  .ac-wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
  .ac-head{display:flex;align-items:center;gap:10px;}
  .ac-head h2{margin:0;font-size:clamp(20px,3vw,30px);flex:1;}
  .ac-lock{font-size:12px;font-weight:bold;padding:5px 9px;border-radius:9px;background:#e6fbf7;color:#16998c;white-space:nowrap;}
  .ac-lock.locked{background:#fff1cc;color:#7a5a00;}
  .ac-close{border:none;background:#2b2d42;color:#fff;font-size:20px;width:44px;height:44px;border-radius:50%;cursor:pointer;}
  .ac-card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.07);}
  .ac-students{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .ac-students .chip{font-size:clamp(13px,1.7vw,16px);padding:8px 12px;}
  .ac-add{display:flex;gap:6px;align-items:center;}
  .ac-add input{font-family:inherit;font-size:16px;padding:7px 10px;border-radius:10px;border:2px solid #dde1ea;width:150px;user-select:text;-webkit-user-select:text;}
  .ac-add button{border:none;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:bold;background:#2ec4b6;color:#fff;cursor:pointer;}
  .ac-hero{display:flex;gap:16px;align-items:center;}
  .ac-hero .big{font-size:clamp(56px,10vw,92px);line-height:1;}
  .ac-hero .who{font-size:clamp(20px,3vw,30px);font-weight:bold;}
  .ac-hero .rank{font-size:clamp(15px,2vw,20px);font-weight:bold;opacity:.8;}
  .ac-hero .now{font-size:clamp(13px,1.6vw,16px);opacity:.6;margin-top:3px;}
  .stars{height:14px;background:#eef0f4;border-radius:7px;overflow:hidden;margin-top:8px;}
  .stars i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8c42);border-radius:7px;}
  .ac-sec{font-weight:bold;font-size:12px;opacity:.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .ac-sec b{opacity:1;}
  /* the 16th-note speed ladder: one step per tempo, taller as it gets faster */
  .ladder{display:flex;align-items:flex-end;gap:5px;height:clamp(120px,22vw,170px);}
  .rung{flex:1;min-width:0;border:none;border-radius:10px 10px 4px 4px;background:#eef0f4;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;padding-top:6px;font-family:inherit;font-weight:bold;color:#8a90a2;}
  .rung .n{font-size:clamp(13px,2vw,20px);}
  .rung .u{font-size:9px;opacity:.7;}
  .rung .s{font-size:clamp(14px,2.4vw,22px);margin-top:auto;padding-bottom:5px;}
  .rung.done{background:linear-gradient(180deg,#ffd23f,#ffb703);color:#5a3d00;}
  .rung.next{background:#fff;outline:3px solid #ff8c42;color:#e0712a;animation:nudge 1.4s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .stage{font-size:clamp(16px,2.2vw,22px);font-weight:bold;margin:6px 4px 0;}
  .level{border:3px solid transparent;}
  .level.done{border-color:#ffd23f;background:#fffbea;}
  .level.current{border-color:#2ec4b6;}
  .level.future{opacity:.6;}
  .lv-head{display:flex;align-items:center;gap:10px;}
  .lv-head .lb{font-size:clamp(30px,4.5vw,42px);line-height:1;}
  .lv-head .ln{flex:1;min-width:0;}
  .lv-head .ln b{display:block;font-size:clamp(16px,2.2vw,21px);}
  .lv-head .ln small{opacity:.55;font-weight:bold;font-size:12px;}
  .lv-head .lp{font-weight:bold;font-size:clamp(14px,1.8vw,17px);white-space:nowrap;}
  .level.done .lv-head .lp{color:#b08300;}
  .item{display:flex;align-items:center;gap:9px;padding:8px 6px;border-top:1px solid #f0f1f5;font-size:clamp(14px,1.8vw,17px);}
  .item .it{flex:1;min-width:0;line-height:1.3;}
  .item .it small{display:block;opacity:.5;font-size:.78em;}
  .tick{flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:3px solid #c7ccd6;background:#fff;font-size:20px;cursor:pointer;color:transparent;}
  .tick.on{background:#2ec4b6;border-color:#25a99d;color:#fff;}
  .try{flex:0 0 auto;border:none;border-radius:10px;padding:8px 11px;font-family:inherit;font-weight:bold;font-size:clamp(13px,1.6vw,15px);background:#eae6ff;color:#5a4ad1;cursor:pointer;white-space:nowrap;}
  .try:active,.tick:active,.rung:active{transform:scale(.93);}
  /* book content we don't have yet: visibly a placeholder, never a plausible stand-in */
  .item.ph{border:2px dashed #b0b6c3;border-radius:10px;background:#fafbfc;margin-top:4px;}
  .phtag{display:inline-block;font-size:10px;background:#ffe08a;color:#7a5a00;padding:2px 6px;border-radius:6px;font-weight:bold;letter-spacing:.5px;margin-right:4px;vertical-align:middle;}
  body.locked .academy .tick{cursor:not-allowed;}
  .levelup{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(43,45,66,.55);}
  .levelup .box{background:#fff;border-radius:28px;padding:26px 34px;text-align:center;max-width:90vw;animation:cpop2 .45s ease;}
  .levelup .lbig{font-size:clamp(90px,18vw,150px);line-height:1;}
  .levelup h3{margin:6px 0 2px;font-size:clamp(26px,5vw,44px);color:#ff8c42;}
  .levelup p{margin:4px 0 16px;font-size:clamp(16px,2.6vw,22px);font-weight:bold;}
  .levelup button{border:none;border-radius:16px;background:#2ec4b6;color:#fff;font-family:inherit;font-weight:bold;font-size:20px;padding:12px 26px;box-shadow:0 5px 0 #25a99d;cursor:pointer;}
  @keyframes cpop2{0%{transform:scale(.5);opacity:0;}70%{transform:scale(1.06);opacity:1;}100%{transform:scale(1);}}

  /* Short screens (landscape phones): hide the title so the drum bar fills the space. */
  @media (max-height:520px){
    h1{display:none;}
    body{gap:5px;}
    .gridwrap{padding:8px;}
  }
</style>
</head>
<body>
  <h1>🥁 Drum Time! 🎵</h1>
  <div class="mission hidden" id="mission"></div>

  <div class="gridwrap">
    <div class="grid" id="grid"></div>
    <div id="countface"><span></span></div>
  </div>

  <!-- top row: the teaching essentials, always visible -->
  <div class="controls">

  <canvas id="fx"></canvas>

<script>
/* ======================= AUDIO ENGINE ======================= */
let ctx;
function ac(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
let noiseBuf;
function noise(){ if(noiseBuf) return noiseBuf; const c=ac(),len=c.sampleRate;
  noiseBuf=c.createBuffer(1,len,c.sampleRate); const d=noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1; return noiseBuf; }

function kick(t){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type="sine";
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+0.13);
  g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.2);}
function snare(t){const c=ac();const n=c.createBufferSource();n.buffer=noise();
  const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=1200;const ng=c.createGain();
  ng.gain.setValueAtTime(0.8,t);ng.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  n.connect(hp).connect(ng).connect(c.destination);
  const o=c.createOscillator(),og=c.createGain();o.type="triangle";o.frequency.setValueAtTime(190,t);
  og.gain.setValueAtTime(0.5,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  o.connect(og).connect(c.destination);n.start(t);n.stop(t+0.2);o.start(t);o.stop(t+0.13);}
function hihat(t){const c=ac();const n=c.createBufferSource();n.buffer=noise();
  const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=7000;const g=c.createGain();
  g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  n.connect(hp).connect(g).connect(c.destination);n.start(t);n.stop(t+0.06);}
/* Open hat: rings until `ring` seconds later, when the next hi-hat closes it.
   A short ring is a real choke — the sound is cut where the foot comes down. */
function openhat(t,ring){const c=ac();const n=c.createBufferSource();n.buffer=noise();n.loop=true;
  const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=6200;
  const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=9000;bp.Q.value=0.6;
  const g=c.createGain();
  const dur=Math.max(0.05,Math.min(ring||0.4,2.0));   // 2s is as long as a real hat rings
  g.gain.setValueAtTime(0.38,t);
  g.gain.exponentialRampToValueAtTime(0.18,t+Math.min(0.07,dur*0.3));  // initial splash
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);                    // then ring out / choke
  n.connect(hp).connect(bp).connect(g).connect(c.destination);n.start(t);n.stop(t+dur+0.02);}
/* Three toms, high to low: a pitch drop plus a little stick noise on the attack.
   The floor tom is lower and rings longer, like the big one on the floor. */
function tomSound(t,hi,lo,len,vol){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type="sine";
  o.frequency.setValueAtTime(hi,t);o.frequency.exponentialRampToValueAtTime(lo,t+len*0.75);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+len);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+len+0.02);
  const n=c.createBufferSource();n.buffer=noise();const bp=c.createBiquadFilter();bp.type="bandpass";
  bp.frequency.value=hi*4;bp.Q.value=0.8;const ng=c.createGain();ng.gain.setValueAtTime(0.12,t);
  ng.gain.exponentialRampToValueAtTime(0.001,t+0.04);n.connect(bp).connect(ng).connect(c.destination);
  n.start(t);n.stop(t+0.05);}
function tom1(t){tomSound(t,320,190,0.26,0.85);}
function tom2(t){tomSound(t,230,130,0.32,0.9);}
function ftom(t){tomSound(t,140,72,0.5,1.0);}
function clap(t){const c=ac();for(let i=0;i<3;i++){const n=c.createBufferSource();n.buffer=noise();
  const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1100;bp.Q.value=1.2;
  const g=c.createGain();const tt=t+i*0.012;g.gain.setValueAtTime(0.7,tt);
  g.gain.exponentialRampToValueAtTime(0.001,tt+0.07);
  n.connect(bp).connect(g).connect(c.destination);n.start(tt);n.stop(tt+0.08);}}
function cowbell(t){const c=ac();[540,800].forEach(f=>{const o=c.createOscillator(),g=c.createGain();
  o.type="square";o.frequency.value=f;g.gain.setValueAtTime(0.3,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);o.connect(g).connect(c.destination);
  o.start(t);o.stop(t+0.2);});}
function clickSound(t,freq,vol){const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+0.05);}
function tone(freq,t,dur){if(!freq)return;const c=ac(),o=c.createOscillator(),g=c.createGain();
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
  o.type="triangle";o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.min(dur,0.9));
  o.connect(lp).connect(g).connect(c.destination);o.start(t);o.stop(t+Math.min(dur,0.95));}

/* voice counting via Web Speech (offline on most tablets) */
let speechOK = ('speechSynthesis' in window);
function warmupSpeech(){ if(!speechOK) return; try{ const u=new SpeechSynthesisUtterance(' ');
  u.volume=0; speechSynthesis.speak(u);}catch(e){} }
function speakCount(word,time){
  if(!speechOK) return;
  const delay=Math.max(0,(time-ac().currentTime)*1000 - 40);
  setTimeout(()=>{ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(word);
    u.rate=1.4;u.pitch=1.25;u.volume=1; speechSynthesis.speak(u);}catch(e){} }, delay);
}

/* ======================= SONGS ======================= */
const NF={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,C5:523.25,G3:196.00,A3:220.00,B3:246.94};
const SONGS={
  twinkle:[["C4",2],["C4",2],["G4",2],["G4",2],["A4",2],["A4",2],["G4",4],["F4",2],["F4",2],["E4",2],["E4",2],["D4",2],["D4",2],["C4",4]],
  mary:[["E4",2],["D4",2],["C4",2],["D4",2],["E4",2],["E4",2],["E4",4],["D4",2],["D4",2],["D4",4],["E4",2],["G4",2],["G4",4]],
  hotcross:[["E4",2],["D4",2],["C4",4],["E4",2],["D4",2],["C4",4],["C4",1],["C4",1],["C4",1],["C4",1],["D4",1],["D4",1],["D4",1],["D4",1],["E4",2],["D4",2],["C4",4]],
  macdonald:[["G4",2],["G4",2],["G4",2],["D4",2],["E4",2],["E4",2],["D4",4],["B4",2],["B4",2],["A4",2],["A4",2],["G4",4]],
  bridge:[["G4",3],["A4",1],["G4",2],["F4",2],["E4",2],["F4",2],["G4",4],["D4",2],["E4",2],["F4",4],["E4",2],["F4",2],["G4",4]],
  row:[["C4",4],["C4",4],["C4",3],["D4",1],["E4",4],["E4",3],["D4",1],["E4",3],["F4",1],["G4",6]],
  itsy:[["C4",2],["C4",2],["C4",2],["D4",2],["E4",4],["E4",2],["D4",2],["C4",2],["D4",2],["E4",2],["C4",4]],
};
let songOnset=null, songLoopTicks=0, currentSong="none";
function buildSong(name){ currentSong=name;
  if(name==="none"||!SONGS[name]){songOnset=null;songLoopTicks=0;return;}
  const seq=SONGS[name],total=seq.reduce((s,n)=>s+n[1],0);
  songLoopTicks=total;songOnset=new Array(total).fill(null);let pos=0;
  for(const [note,ticks] of seq){songOnset[pos]={freq:NF[note],ticks};pos+=ticks;} }

/* ======================= STATE ======================= */
let bpm=90, stepsPerBar=4, bars=1;
let metro="off", countIn=false, reward=true, locked=false;
/* Hi-Hat cells have three states: 0 off, 1 closed, 2 open. Every other drum is on/off. */
const OPEN=2;
/* What a tap on a hi-hat cell puts down: 1 closed or OPEN. Picked with the two
   buttons in the row label, so every hi-hat edit is a single tap. */
let hatBrush=1;
const INSTR=[
  {key:"hihat",name:"Hi-Hat",word:"Tss·Tsss",emoji:"✨",openEmoji:"💫",fn:hihat,enabled:true,tri:true},
  {key:"snare",name:"Snare",word:"Ka",emoji:"🥁",fn:snare,enabled:true},
  {key:"tom1",name:"Tom 1",word:"Ding",emoji:"🪘",fn:tom1,enabled:false},
  {key:"tom2",name:"Tom 2",word:"Dum",emoji:"🪘",fn:tom2,enabled:false},
  {key:"ftom",name:"Floor Tom",word:"Doom",emoji:"🛢️",fn:ftom,enabled:false},
  {key:"bass",name:"Bass",word:"Boom",emoji:"💥",fn:kick,enabled:true},
  {key:"clap",name:"Clap",word:"Clap",emoji:"👏",fn:clap,enabled:false},
  {key:"cowbell",name:"Cowbell",word:"Ding",emoji:"🔔",fn:cowbell,enabled:false},
];
/* muted = the row still shows and keeps its pattern, it just makes no sound.
   That is different from enabled, which takes the row off the grid entirely. */
for(const i of INSTR) i.muted=false;
let pattern={};
/* The clock runs in 16th-note ticks: 16 per bar, whatever the grid resolution is. */
const TICKS_PER_BAR=16;
function totalSteps(){ return stepsPerBar*bars; }        // cells across the whole loop
function loopTicks(){ return TICKS_PER_BAR*bars; }        // 16th ticks in the whole loop
function ticksPerStep(){ return TICKS_PER_BAR/stepsPerBar; } // 4 / 2 / 1
function initPattern(){ for(const i of INSTR) pattern[i.key]=new Array(totalSteps()).fill(false); }
function active(){ return INSTR.filter(i=>i.enabled); }

/* ======================= GRID UI ======================= */
const gridEl=document.getElementById("grid");
function paintCell(c,inst,v){
  c.classList.toggle("on",!!v);
  c.classList.toggle("open",v===OPEN);
  c.firstElementChild.textContent = v===OPEN ? inst.openEmoji : inst.emoji;
}
function buildGrid(){
  const insts=active(), total=totalSteps();
  gridEl.innerHTML="";
  gridEl.classList.toggle("dense",total>8);
  gridEl.classList.toggle("superdense",total>16);
  gridEl.style.gridTemplateColumns=`minmax(max(94px,8.5vw),0.75fr) repeat(${total},2fr)`;
  gridEl.style.gridTemplateRows=`auto repeat(${insts.length},1fr)`;
  const corner=document.createElement("div");
  corner.innerHTML=`<button class="gridclear" id="clear" title="Clear every beat">🧹 Clear</button>`;
  gridEl.appendChild(corner);
  const tps=ticksPerStep(), crowded=total>16;
  for(let s=0;s<total;s++){const b=document.createElement("div");b.className="beatnum";b.dataset.col=s;
    const tickInBar=(s%stepsPerBar)*tps;              // 0..15, where in the bar this cell sits
    if(tickInBar%4===0) b.textContent=tickInBar/4+1;  // 1 2 3 4
    else{ b.classList.add("and");                     // "e  &  a" between the beats
      b.textContent = crowded ? "" : (tickInBar%4===2?"&":(tickInBar%4===1?"e":"a")); }
    if(bars>1&&s%stepsPerBar===0){ const bar=s/stepsPerBar;
      if(s>0){ b.classList.add("barstart","hasclear");
        b.innerHTML=`<button class="barclear" data-bar="${bar}" title="Clear every beat in Bar ${bar+1}">🧹 Bar ${bar+1}</button>`
          +`<span class="num">${b.textContent}</span>`; }
      else b.innerHTML=`<span class="barlabel">Bar ${bar+1}</span>`+b.textContent; }
    gridEl.appendChild(b);}
  for(const inst of insts){
    const lab=document.createElement("div");lab.className="label "+inst.key+(inst.muted?" muted":"");
    lab.innerHTML=`<button class="mute${inst.muted?" on":""}" data-mute="${inst.key}"`
      +` title="Mute this row">${inst.muted?"🔇":"🔊"}</button>`
      +`<span class="labtext"><span class="name">${inst.tri?"":inst.emoji+" "}${inst.name}</span>`
      +(inst.tri ? `</span>`+brushHTML() : `<span class="word">“${inst.word}”</span></span>`);
    gridEl.appendChild(lab);
    for(let s=0;s<total;s++){
      const c=document.createElement("button");c.className="cell "+inst.key+(inst.muted?" muted":"");
      if(bars>1&&s>0&&s%stepsPerBar===0)c.classList.add("barstart");
      c.dataset.inst=inst.key;c.dataset.col=s;
      c.innerHTML=`<span class="dot"></span>`;
      paintCell(c,inst,pattern[inst.key][s]);
      c.addEventListener("click",()=>{ if(locked)return;
        const v=pattern[inst.key][s];
        // hi-hat: put down the brush's kind, or clear it if it is already there;
        // everything else just toggles
        const nv=inst.tri ? (v===hatBrush?0:hatBrush) : !v;
        pattern[inst.key][s]=nv;
        paintCell(c,inst,nv);
        if(nv&&!inst.muted){const c2=ac();if(c2.resume)c2.resume();
          if(nv===OPEN)openhat(c2.currentTime+0.01,hatRing(s)); else inst.fn(c2.currentTime+0.01);}
        saveLast(); });
      gridEl.appendChild(c);
    }
  }
}

function brushHTML(){
  return `<span class="brush">`
    +`<button data-brush="1" class="${hatBrush===1?"sel":""}" title="Closed hat (Tss): tap cells to add">✨</button>`
    +`<button data-brush="${OPEN}" class="${hatBrush===OPEN?"sel":""}" title="Open hat (Tsss): tap cells to add">💫</button>`
    +`</span>`;
}
function paintBrush(){
  gridEl.querySelectorAll(".brush button").forEach(b=>b.classList.toggle("sel",+b.dataset.brush===hatBrush));
}

/* Repaint one row's mute state in place — cheaper than rebuilding the grid,
   and it keeps the play-head highlight from flickering mid-loop. */
function paintMute(inst){
  const lab=gridEl.querySelector(`.label.${inst.key}`);
  if(lab){ lab.classList.toggle("muted",inst.muted);
    const b=lab.querySelector(".mute");
    if(b){ b.classList.toggle("on",inst.muted); b.textContent=inst.muted?"🔇":"🔊"; } }
  gridEl.querySelectorAll(`.cell[data-inst="${inst.key}"]`)
        .forEach(c=>c.classList.toggle("muted",inst.muted));
}
gridEl.addEventListener("click",e=>{
  if(locked) return;
  const m=e.target.closest(".mute");
  if(m){ const inst=INSTR.find(i=>i.key===m.dataset.mute);
    if(inst){ inst.muted=!inst.muted; paintMute(inst); saveLast(); } return; }
  const br=e.target.closest(".brush button");
  if(br){ hatBrush=+br.dataset.brush; paintBrush();
    // let them hear which hat they just picked
    const hat=INSTR.find(i=>i.key==="hihat");
    if(!hat.muted){ const c=ac(); if(c.resume)c.resume();
      if(hatBrush===OPEN) openhat(c.currentTime+0.01,0.5); else hihat(c.currentTime+0.01); }
    return; }
  // wipes every cell on every row; mute states and the chosen drums stay put
  if(e.target.closest(".gridclear")){ initPattern(); buildGrid(); flashCount("🧹"); saveLast(); return; }
  // wipes one bar only (the 🧹 Bar 2 button); bar 1 keeps its groove
  const bc=e.target.closest(".barclear");
  if(bc){ const from=+bc.dataset.bar*stepsPerBar, to=from+stepsPerBar;
    for(const i of INSTR) for(let s=from;s<to;s++) pattern[i.key][s]=false;
    buildGrid(); flashCount("🧹"); saveLast(); }
});

/* ======================= SCHEDULER ======================= */
let playing=false,nextTick=0,nextTickTime=0,timer=null;
const SCHED_AHEAD=0.12,LOOKAHEAD=25;
let visQueue=[];
function tickDur(){return (60/bpm)/4;}   // one 16th note

/* word for a position in the bar: 1 e & a  2 e & a ... */
function countWord(tib){ const r=tib%4;
  return r===0 ? String(tib/4+1) : (r===1?"e":(r===2?"and":"a")); }

function scheduleTick(tick,time){
  const lt=loopTicks();
  const tip=((tick%lt)+lt)%lt;                 // tick position in the whole loop
  const tib=tip%TICKS_PER_BAR;                 // tick position inside its own bar
  const isDown=tib===0, isCount=tick<0, tps=ticksPerStep();
  // metronome ticks at the grid's own resolution
  if(metro!=="off" && tib%tps===0) metroHit(tib,time,isDown);
  if(!isCount){
    if(tip%tps===0) fireStep(tip/tps,time);
    // songs are written in eighth notes, so they land on every other 16th tick
    if(songOnset&&songLoopTicks&&tick%2===0){
      const o=songOnset[(tick/2)%songLoopTicks]; if(o)tone(o.freq,time,o.ticks*tickDur()*2);}
  }
  visQueue.push({time,tick});
}
function metroHit(tib,time,isDown){
  const isBeat=tib%4===0, isEighth=tib%2===0;
  if(metro==="beep") clickSound(time, isDown?1600:1050,
    isDown?0.32:(isBeat?0.22:(isEighth?0.12:0.08)));
  else if(metro==="count") speakCount(countWord(tib), time);
}
/* How long an open hat at `step` rings: until the next hi-hat cell of any kind,
   which is the hand/foot coming back down. Nothing after it -> ring the whole loop. */
function hatRing(step){
  const total=totalSteps(),p=pattern.hihat,gap=ticksPerStep()*tickDur();
  for(let i=1;i<=total;i++) if(p[(step+i)%total]) return i*gap;
  return total*gap;
}
function fireStep(step,time){
  for(const inst of active()){
    if(inst.muted) continue;
    const v=pattern[inst.key][step]; if(!v) continue;
    if(v===OPEN&&inst.tri) openhat(time,hatRing(step)); else inst.fn(time);
  }
}

function scheduler(){
  const c=ac();
  while(nextTickTime < c.currentTime+SCHED_AHEAD){ scheduleTick(nextTick,nextTickTime);
    nextTickTime+=tickDur(); nextTick++; }
  timer=setTimeout(scheduler,LOOKAHEAD);
}
function start(){
  const c=ac();if(c.resume)c.resume();warmupSpeech();
  playing=true; nextTick=countIn?-TICKS_PER_BAR:0; nextTickTime=c.currentTime+0.08;
  scheduler();drawLoop();
  // the backing track waits out the count-in, so bar 1 lands together
  if(trackAudio){ const lead=countIn?TICKS_PER_BAR*tickDur()*1000:0;
    if(lead) trackStartT=setTimeout(startTrack,lead); else startTrack(); }
  play.classList.add("playing");play.textContent="⏸ Stop";
}
function stop(){playing=false;clearTimeout(timer);visQueue=[];stopTrack();if(speechOK)try{speechSynthesis.cancel()}catch(e){};
  clearHighlights();countface.classList.remove("show");play.classList.remove("playing");play.textContent="▶ Play";}

/* ======================= VISUALS ======================= */
function clearHighlights(){gridEl.querySelectorAll(".col-active").forEach(e=>e.classList.remove("col-active"));
  gridEl.querySelectorAll(".hit").forEach(e=>e.classList.remove("hit"));}
function highlightStep(step){
  clearHighlights();
  gridEl.querySelectorAll(`[data-col="${step}"]`).forEach(e=>e.classList.add("col-active"));
  for(const inst of active()) if(pattern[inst.key][step]){
    const cell=gridEl.querySelector(`.cell[data-inst="${inst.key}"][data-col="${step}"]`);
    if(cell){void cell.offsetWidth;cell.classList.add("hit");}

const countface=document.getElementById("countface");

  countface.classList.remove("show");void countface.offsetWidth;countface.classList.add("show");}
function processTick(tick){
  const lt=loopTicks();
  const tip=((tick%lt)+lt)%lt, tib=tip%TICKS_PER_BAR, tps=ticksPerStep();
  // big count overlay — quarters and "and"s only; flashing every 16th is unreadable
  const onGrid=tib%tps===0, showable=tib%2===0;
  let word=null;
  if(tick<0){ if(onGrid&&showable&&(stepsPerBar>4||tib%4===0)) word=countWord(tib); }
  else if(metro==="count"&&onGrid&&showable&&(stepsPerBar>4||tib%4===0)) word=countWord(tib);
  if(word)flashCount(word);
  // step highlight
  if(tick>=0&&tip%tps===0) highlightStep(tip/tps);
  // reward every 4 bars
  if(reward&&tick>0&&tib===0){ const bar=tick/TICKS_PER_BAR; if(bar%4===0) spawnReward(); }
}
function drawLoop(){ if(!playing)return; const now=ac().currentTime;
  while(visQueue.length&&visQueue[0].time<=now){ processTick(visQueue.shift().tick); }
  requestAnimationFrame(drawLoop);
}

function spawnReward(){
  for(let i=0;i<22;i++) parts.push({x:innerWidth*(0.2+Math.random()*0.6),y:innerHeight+10,
    vx:(Math.random()-0.5)*5,vy:-(7+Math.random()*7),g:0.22,life:1,
    char:CHARS[(Math.random()*CHARS.length)|0],size:22+Math.random()*22,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.3});
  if(!fxRunning){fxRunning=true;fxLoop();}
}
function fxLoop(){ fxc.clearRect(0,0,fx.width,fx.height);
  for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=0.012;
    fxc.save();fxc.globalAlpha=Math.max(0,p.life);fxc.translate(p.x,p.y);fxc.rotate(p.rot);
    fxc.font=p.size+"px serif";fxc.textAlign="center";fxc.fillText(p.char,0,0);fxc.restore();}
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+60);
  if(parts.length)requestAnimationFrame(fxLoop);else{fxRunning=false;fxc.clearRect(0,0,fx.width,fx.height);}
}

/* ======================= SHED TRACKS ======================= */
/* Drumless backing tracks to play along to. The track follows the speed slider:
   it plays at (bpm / the track's own tempo), pitch held so it stays in tune.
   Each track's own tempo is editable by tapping along — see tap tempo below. */
const TRACKS={
  terminator:{file:"tracks/terminator-hiphop.mp3",bpm:86, credit:"TERMINATOR · shedtracks.com"},
  rock:      {file:"tracks/heavy-rock.mp3",       bpm:130,credit:"Heavy Rock · youjammusic.com"},
};
/* Past these the file stops sounding like music, so we clamp and flag it
   rather than pretend the track is still following the click. */
const MIN_RATE=0.5, MAX_RATE=2;
let currentTrack="none", trackBpm={}, trackVol=0.8, trackAudio=null, trackStartT=null;
const shedInfo=document.getElementById("shedInfo"),
      shedCredit=document.getElementById("shedCredit"),
      shedVol=document.getElementById("shedVol"),
      tapBtn=document.getElementById("tapTempo");

function baseBpm(k){ return trackBpm[k] || (TRACKS[k] ? TRACKS[k].bpm : 0); }
function wantRate(){ const b=baseBpm(currentTrack); return b ? bpm/b : 1; }
function trackRate(){ return Math.max(MIN_RATE,Math.min(MAX_RATE,wantRate())); }
function applyRate(){ if(!trackAudio) return;
  trackAudio.playbackRate=trackRate();
  trackAudio.preservesPitch=trackAudio.mozPreservesPitch=trackAudio.webkitPreservesPitch=true; }
function shedRender(){
  const t=TRACKS[currentTrack];
  if(!t){ shedInfo.innerHTML='—<small>no track</small>'; shedCredit.textContent=""; return; }
  const r=trackRate(), capped=Math.abs(r-wantRate())>0.005;
  shedInfo.innerHTML=`${r.toFixed(2)}×${capped?' <span class="warn">⚠</span>':''}`
                    +`<small>track ${baseBpm(currentTrack)} bpm</small>`;
  shedCredit.textContent=t.credit;
}
/* Build the <audio> for the current track WITHOUT touching bpm — this is what
   a restored save calls, and a save already carries its own bpm. */
function mountTrack(){
  if(trackAudio){ trackAudio.pause(); trackAudio=null; }
  const t=TRACKS[currentTrack];
  if(t){ trackAudio=new Audio(t.file); trackAudio.volume=trackVol;
    trackAudio.addEventListener("ended",()=>{ if(playing) stop(); });
    applyRate(); }
  document.querySelectorAll(".shed .chip").forEach(c=>c.classList.toggle("sel",c.dataset.track===currentTrack));
  shedVol.value=Math.round(trackVol*100);
  shedRender();
}
function selectTrack(key){
  const wasPlaying=playing;
  currentTrack=TRACKS[key]?key:"none";
  mountTrack();
  if(trackAudio){
    // iOS only lets an <audio> play later if it was started inside a real tap,
    // so unlock it here on the chip tap, silently.
    const a=trackAudio; a.muted=true;
    a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;});
    if(bpm!==baseBpm(currentTrack)) setBpm(baseBpm(currentTrack));  // open at the track's own speed
    if(wasPlaying) startTrack();
  }
  shedRender(); saveLast();
}
function startTrack(){ if(!trackAudio) return;
  applyRate(); trackAudio.currentTime=0; trackAudio.play().catch(()=>{}); }
function stopTrack(){ if(trackStartT){ clearTimeout(trackStartT); trackStartT=null; }
  if(trackAudio) trackAudio.pause(); }

document.querySelector(".shed").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(b) selectTrack(b.dataset.track);
});
shedVol.addEventListener("input",e=>{ trackVol=+e.target.value/100;
  if(trackAudio) trackAudio.volume=trackVol; saveLast(); });

/* Tap tempo — fixes a track whose real tempo isn't what we guessed.
   Tap the pulse 4+ times; that becomes the track's tempo and the speed slider
   moves to match, so the track plays at 1.00x. */
let taps=[], tapClear=null;
tapBtn.addEventListener("click",()=>{
  if(!TRACKS[currentTrack]){ flashCount("🎵"); return; }
  const now=performance.now();
  if(taps.length && now-taps[taps.length-1]>2500) taps=[];   // long gap = starting over
  taps.push(now); if(taps.length>8) taps.shift();
  tapBtn.classList.add("armed");
  clearTimeout(tapClear);
  tapClear=setTimeout(()=>{ tapBtn.classList.remove("armed"); taps=[]; },2500);
  if(taps.length>=4){
    let sum=0; for(let i=1;i<taps.length;i++) sum+=taps[i]-taps[i-1];
    const v=Math.round(60000/(sum/(taps.length-1)));
    if(v>=40&&v<=220){ trackBpm[currentTrack]=v; setBpm(v); shedRender(); saveLast(); }
  }
});

document.getElementById("noteMode").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const ns=+b.dataset.steps;if(ns===stepsPerBar)return;
  const oldTps=ticksPerStep(),oldPat=pattern;stepsPerBar=ns;pattern={};
  const total=totalSteps(),tps=ticksPerStep();
  // match cells by where they sit in the bar, so hits keep their real timing.
  // Coarser grids drop hits that no longer have a cell to live on.
  for(const inst of INSTR){pattern[inst.key]=new Array(total).fill(false);
    for(let s=0;s<total;s++){const t=s*tps;
      if(t%oldTps===0)pattern[inst.key][s]=oldPat[inst.key][t/oldTps]||false;}}
  setSeg("noteMode",b);buildGrid();saveLast();
});

/* 1 bar <-> 2 bars. Growing copies bar 1 into bar 2 so the groove keeps going;
   the second bar is then there to turn into a fill. Shrinking keeps bar 1. */
document.getElementById("barMode").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const nb=+b.dataset.bars;if(nb===bars)return;
  const oldPat=pattern,oldTotal=totalSteps();bars=nb;const total=totalSteps();pattern={};
  for(const inst of INSTR){pattern[inst.key]=new Array(total).fill(false);
    for(let s=0;s<total;s++) pattern[inst.key][s]=oldPat[inst.key][s%oldTotal]||false;}
  setSeg("barMode",b);buildGrid();saveLast();
});

/* ======================= SAVE / LOAD ======================= */
function snapshot(){return{pattern:JSON.parse(JSON.stringify(pattern)),stepsPerBar,bars,bpm,
  enabled:INSTR.reduce((o,i)=>(o[i.key]=i.enabled,o),{}),
  muted:INSTR.reduce((o,i)=>(o[i.key]=i.muted,o),{}),song:currentSong,metro,countIn,reward,
  track:currentTrack,trackBpm:{...trackBpm},trackVol};}
function applyState(s){ if(!s)return;
  stepsPerBar=s.stepsPerBar||4; bars=s.bars||1; bpm=s.bpm||90;
  for(const i of INSTR) if(s.enabled&&i.key in s.enabled) i.enabled=s.enabled[i.key];
  for(const i of INSTR) i.muted = !!(s.muted && s.muted[i.key]);
  initPattern();
  if(s.pattern)for(const k in pattern){const src=s.pattern[k]||[];for(let j=0;j<totalSteps();j++)pattern[k][j]=src[j]||false;}
  // states saved before the hats were merged kept a separate row — fold it back in as open hits
  // saves from before the toms were split had one "tom" row — it becomes Tom 1
  if(s.pattern&&s.pattern.tom&&!s.pattern.tom1){s.pattern.tom.forEach((v,j)=>{if(v&&j<totalSteps())pattern.tom1[j]=true;});
    if(s.enabled&&s.enabled.tom){const t1=INSTR.find(i=>i.key==="tom1");if(t1)t1.enabled=true;}}
  if(s.pattern&&s.pattern.openhat)s.pattern.openhat.forEach((v,j)=>{if(v&&j<totalSteps())pattern.hihat[j]=OPEN;});
  buildSong(s.song||"none"); metro=s.metro||"off"; countIn=!!s.countIn; reward=s.reward!==false;
  trackBpm=s.trackBpm||{}; trackVol=typeof s.trackVol==="number"?s.trackVol:0.8;
  currentTrack=TRACKS[s.track]?s.track:"none";
  refreshUI();
}
function refreshUI(){
  bpmEl.textContent=bpm;tempo.value=bpm;
  [...document.getElementById("noteMode").children].forEach(c=>c.classList.toggle("sel",+c.dataset.steps===stepsPerBar));
  [...document.getElementById("barMode").children].forEach(c=>c.classList.toggle("sel",+c.dataset.bars===bars));
  [...document.getElementById("metro").children].forEach(c=>c.classList.toggle("sel",c.dataset.m===metro));
  countinBtn.classList.toggle("on",countIn);rewardBtn.classList.toggle("on",reward);
  document.querySelectorAll(".song .chip").forEach(c=>c.classList.toggle("sel",c.dataset.song===currentSong));
  buildInstrChips();buildGrid();renderSlots();mountTrack();
}
function saveLast(){try{localStorage.setItem("dt.last",JSON.stringify(snapshot()));}catch(e){}}
function loadLast(){try{const s=localStorage.getItem("dt.last");return s?JSON.parse(s):null;}catch(e){return null;}}
function renderSlots(){document.querySelectorAll(".slot").forEach(b=>{
  b.classList.toggle("filled",!!localStorage.getItem("dt.slot"+b.dataset.slot));});}
document.querySelectorAll(".slot").forEach(b=>{let t=null,held=false;
  b.addEventListener("pointerdown",()=>{held=false;t=setTimeout(()=>{held=true;
    localStorage.setItem("dt.slot"+b.dataset.slot,JSON.stringify(snapshot()));renderSlots();flashCount("💾");},600);});
  ["pointerup"].forEach(ev=>b.addEventListener(ev,()=>{if(t)clearTimeout(t);
    if(!held){const s=localStorage.getItem("dt.slot"+b.dataset.slot);if(s){applyState(JSON.parse(s));saveLast();}}}));
  ["pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>{if(t){clearTimeout(t);t=null;}}));
});

   ladder for 16th notes, and a teacher's tick on every skill. Progress lives in
   this device's localStorage (the teacher's tablet). Student names are typed in
   here and never written into the code, because this page is public. */
const seq=(a,b)=>{const r=[];for(let i=a;i<b;i++)r.push(i);return r;};
const every=(n)=>seq(0,n), evens=(n)=>seq(0,n).filter(i=>i%2===0);
function pre(steps,bars,bpm,hits,opt){return Object.assign({steps,bars,bpm,hits,metro:"beep"},opt||{});}

const S16=(bpm)=>pre(16,1,bpm,{snare:every(16)});
/* one speed-ladder step: 16th notes on the snare, R L R L, at this tempo */
const rung=(bpm)=>({id:"s"+bpm,ladder:bpm,t:`🪜 16th notes R L R L at ${bpm}`,sub:"4 bars non-stop with the click, hands even",p:S16(bpm)});

   Hen = Grade 1 → Owl = Grade 2 → Parrot = Grade 3 → Eagle = Grade 4 → Phoenix = Grade 5 →

    {id:"fra", t:"🪘 16th fill with a rest on the “a”",sub:"play 1 e & · — da-da-DUM ·",p:restFill([0,1,2])},
    rung(90), rung(95), rung(100),
    song("g2a","Grade 2",1), song("g2b","Grade 2",2), song("g2c","Grade 2",3),
  ]},
  bookGrade(3,"🦜","Parrot"),
  bookGrade(4,"🦅","Eagle"),
  bookGrade(5,"🐦‍🔥","Phoenix"),
  bookGrade(6,"🐉","Dragon"),
];
const LADDER=COURSE.flatMap(L=>L.items.filter(i=>i.ladder)).sort((a,b)=>a.ladder-b.ladder);
const TOTAL_ITEMS=COURSE.reduce((n,L)=>n+L.items.length,0);

let acad={students:[],cur:null};
try{const s=JSON.parse(localStorage.getItem("dt.academy")||"null"); if(s&&Array.isArray(s.students)) acad=s;}catch(e){}
function acadSave(){try{localStorage.setItem("dt.academy",JSON.stringify(acad));}catch(e){}}
function stu(){return acad.students.find(s=>s.id===acad.cur)||null;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function findItem(id){for(const L of COURSE)for(const it of L.items)if(it.id===id)return{L,it};return null;}
function levelDone(st,L){return L.items.every(i=>st.ticks[i.id]);}
function levelCount(st,L){return L.items.filter(i=>st.ticks[i.id]).length;}
function curLevel(st){const i=COURSE.findIndex(L=>!levelDone(st,L));return i<0?COURSE.length:i;}

const acadEl=document.getElementById("academy"), missionEl=document.getElementById("mission");
/* Coming back from a skill returns to the same spot in the list, not the top. */
let acadScroll=0;
function openAcademy(){renderAcademy();acadEl.classList.remove("hidden");acadEl.scrollTop=acadScroll;}
function closeAcademy(){acadScroll=acadEl.scrollTop;acadEl.classList.add("hidden");}

function renderAcademy(){
  const st=stu();
  let h=`<div class="ac-wrap"><div class="ac-head"><h2>🏆 Drum Academy</h2>`
    +`<span class="ac-lock${locked?" locked":""}">${locked?"🔒 Locked — teacher unlocks to tick":"🔓 Teacher can tick"}</span>`
    +`<button class="ac-close" data-act="close" title="Back to the drums">✕</button></div>`;
  h+=`<div class="ac-card ac-students">`;
  for(const s of acad.students) h+=`<button class="chip${s.id===acad.cur?" sel":""}" data-act="stu" data-id="${s.id}">${esc(s.name)}</button>`;
  h+=`<span class="ac-add"><input id="newStu" maxlength="24" placeholder="Student name" /><button data-act="add">➕ Add</button></span></div>`;
  if(!st){ acadEl.innerHTML=h+`<div class="ac-card" style="text-align:center;font-weight:bold;opacity:.6">👆 Add a student to start their course</div></div>`; return; }

  const ci=curLevel(st), next=COURSE[ci], me=next||COURSE[COURSE.length-1], stars=Object.keys(st.ticks).filter(k=>findItem(k)).length;
  h+=`<div class="ac-card ac-hero"><div class="big">${me.badge}</div><div style="flex:1;min-width:0">`
    +`<div class="who">${esc(st.name)}</div>`
    +`<div class="rank">${me.name} · ${me.tag}</div>`
    +`<div class="now">${next?`${levelCount(st,next)}/${next.items.length} done — `+(COURSE[ci+1]?`then you grow into ${COURSE[ci+1].badge} ${COURSE[ci+1].name}!`:"then you fly! 🏅"):"🏅 Every level passed — you can fly!"}</div>`
    +`<div class="stars"><i style="width:${Math.round(stars/TOTAL_ITEMS*100)}%"></i></div>`
    +`<div class="now">⭐ ${stars} / ${TOTAL_ITEMS} skills</div></div></div>`;

  const nextRung=LADDER.find(r=>!st.ticks[r.id]);
  h+=`<div class="ac-card"><div class="ac-sec"><b>🪜 16th-note speed ladder</b> · tap a step to practise it · pass = 4 bars non-stop, hands even</div><div class="ladder">`;
  LADDER.forEach((r,i)=>{const done=!!st.ticks[r.id], nx=r===nextRung;
    h+=`<button class="rung${done?" done":""}${nx?" next":""}" data-act="try" data-id="${r.id}" style="height:${34+i*(66/(LADDER.length-1))}%">`
      +`<span class="n">${r.ladder}</span><span class="u">bpm</span><span class="s">${done?"⭐":(nx?"👆":"")}</span></button>`;});
  h+=`</div></div>`;

  let stage=null;
  COURSE.forEach((L,li)=>{
    if(L.stage!==stage){stage=L.stage;h+=`<div class="stage">${STAGES[stage]}</div>`;}
    const done=levelDone(st,L), state=done?"done":(li===ci?"current":(li>ci?"future":""));
    h+=`<div class="ac-card level ${state}"><div class="lv-head"><span class="lb">${L.badge}</span>`
      +`<span class="ln"><b>${L.name}</b><small>Level ${li+1} · ${L.tag}</small></span>`
      +`<span class="lp">${done?"✓ PASSED":levelCount(st,L)+" / "+L.items.length}</span></div>`;
    for(const it of L.items){const on=!!st.ticks[it.id];
      h+=`<div class="item${it.ph?" ph":""}"><button class="tick${on?" on":""}" data-act="tick" data-id="${it.id}" title="Teacher ticks when passed">✓</button>`
        +`<span class="it">${it.ph?'<span class="phtag">PLACEHOLDER</span>':""}${esc(it.t)}`
        +`${it.sub?`<small>${esc(it.sub)}</small>`:""}${on?`<small>passed ${st.ticks[it.id]}</small>`:""}</span>`
        +`${it.p?`<button class="try" data-act="try" data-id="${it.id}">▶ Try</button>`:""}</div>`;}
    h+=`</div>`;
  });
  acadEl.innerHTML=h+`</div>`;
}

/* Load an exercise straight into the drum machine, with the click and a count-in. */
function applyPreset(p){
  if(playing) stop();
  const total=p.steps*p.bars, pat={}, en={};
  for(const i of INSTR){ pat[i.key]=new Array(total).fill(false);
    en[i.key]=["hihat","snare","bass"].includes(i.key)||!!p.hits[i.key]; }
  for(const k in p.hits) for(const j of p.hits[k]) if(j<total) pat[k][j]= k==="hihat"?1:true;
  for(const j of (p.open||[])) if(j<total) pat.hihat[j]=OPEN;   // open hats on these cells
  applyState({pattern:pat,stepsPerBar:p.steps,bars:p.bars,bpm:p.bpm,enabled:en,muted:{},song:"none",
    metro:p.metro||"beep",countIn:true,reward:true,track:p.track||"none",trackBpm,trackVol});
  saveLast();
}

let mission=null;   // {sid, id}: the skill on screen right now
function renderMission(){
  const st=mission&&acad.students.find(s=>s.id===mission.sid), f=mission&&findItem(mission.id);
  if(!st||!f){mission=null;missionEl.classList.add("hidden");return;}
  const done=!!st.ticks[f.it.id];
  missionEl.innerHTML=`<span class="mbadge">${f.L.badge}</span>`
    +`<span class="mtext">${esc(st.name)} · ${esc(f.it.t)}</span>`
    +(f.it.sub?`<span class="mrule">${esc(f.it.sub)}</span>`:"")
    +`<button class="mpass${done?" on":""}" data-act="pass">${done?"⭐ Passed":"✓ Pass"}</button>`
    +`<button data-act="acad" title="Back to the course">🏆</button><button data-act="x" title="Close">✕</button>`;
  missionEl.classList.remove("hidden");
}

function stampSound(){const c=ac();if(c.resume)c.resume();const t=c.currentTime+0.02;
  tone(NF.G4,t,0.12);tone(NF.C5,t+0.1,0.3);}
function fanfare(){const c=ac();if(c.resume)c.resume();const t=c.currentTime+0.05;
  [NF.C4,NF.E4,NF.G4,NF.C5].forEach((f,i)=>tone(f,t+i*0.14,i===3?0.9:0.2));}
function levelUp(st,L){
  fanfare(); spawnReward(); setTimeout(spawnReward,350); setTimeout(spawnReward,700);
  const d=document.createElement("div"); d.className="levelup";
  d.innerHTML=`<div class="box"><div class="lbig">${L.badge}</div><h3>LEVEL UP!</h3>`
    +`<p>${esc(st.name)} is now a ${L.name}<br><small style="opacity:.6">${L.tag}</small></p><button>🎉 Yay!</button></div>`;
  d.addEventListener("click",()=>d.remove()); document.body.appendChild(d);
}
/* Teacher's tick. Blocked while locked, so a student can't pass themselves. */
function toggleTick(st,id){
  if(locked){flashCount("🔒");return false;}
  const f=findItem(id); if(!f) return false; const was=levelDone(st,f.L);
  if(st.ticks[id]) delete st.ticks[id];
  else st.ticks[id]=new Date().toISOString().slice(0,10);
  acadSave();
  if(st.ticks[id]){ stampSound(); if(!was&&levelDone(st,f.L)) levelUp(st,f.L); else spawnReward(); }
  return true;
}

function addStudent(){const inp=document.getElementById("newStu"); const name=(inp&&inp.value||"").trim();
  if(!name) return; const s={id:"s"+Date.now().toString(36),name,ticks:{}};
  acad.students.push(s); acad.cur=s.id; acadSave(); renderAcademy();}

acadEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, st=stu();
  if(act==="close") closeAcademy();
  else if(act==="add") addStudent();
  else if(act==="stu"){ acad.cur=b.dataset.id; acadSave(); renderAcademy(); }
  else if(act==="tick"&&st){ if(toggleTick(st,b.dataset.id)) renderAcademy(); }
  else if(act==="try"&&st){ const f=findItem(b.dataset.id); if(f&&f.it.p){
    applyPreset(f.it.p); mission={sid:st.id,id:f.it.id}; renderMission(); closeAcademy(); } }
});
acadEl.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="newStu") addStudent(); });
missionEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  if(b.dataset.act==="pass"){ const st=mission&&acad.students.find(s=>s.id===mission.sid);
    if(st&&toggleTick(st,mission.id)) renderMission(); }
  else if(b.dataset.act==="acad") openAcademy();
  else if(b.dataset.act==="x"){ mission=null; renderMission(); }
});
document.getElementById("acadBtn").addEventListener("click",openAcademy);

/* ======================= INIT ======================= */
initPattern();
const last=loadLast();
if(last){ applyState(last); }
else{
  buildInstrChips();
  pattern.hihat=pattern.hihat.map(()=>1);   // closed hats on every step
  pattern.snare[stepsPerBar===4?2:4]=true; pattern.bass[0]=true;
  buildGrid(); renderSlots(); mountTrack();
}

/* register service worker (offline + home-screen install) and auto-reload on update */
if('serviceWorker' in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing) return; refreshing=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(!w) return;
        w.addEventListener('statechange',()=>{
          if(w.state==='installed' && navigator.serviceWorker.controller){ w.postMessage&&0; }
        });
      });
      setInterval(()=>reg.update().catch(()=>{}), 60000);
    }).catch(()=>{});
  });
}
</script>
