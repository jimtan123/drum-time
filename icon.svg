<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#ff8c42"/>
      <stop offset="1" stop-color="#7b6cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- drum body -->
  <ellipse cx="256" cy="356" rx="150" ry="46" fill="#5a4ad1"/>
  <rect x="106" y="232" width="300" height="124" fill="#7b6cf6"/>
  <ellipse cx="256" cy="232" rx="150" ry="46" fill="#eef0f4"/>
  <ellipse cx="256" cy="232" rx="150" ry="46" fill="none" stroke="#ffffff" stroke-width="10"/>
  <!-- tension lugs / zigzag -->
  <path d="M106 250 L150 300 L194 250 L238 300 L282 250 L326 300 L370 250 L406 300"
        fill="none" stroke="#ffd23f" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- drumsticks -->
  <g stroke="#fff7e6" stroke-width="20" stroke-linecap="round">
    <line x1="196" y1="150" x2="286" y2="232"/>
    <line x1="320" y1="150" x2="230" y2="232"/>
  </g>
  <circle cx="196" cy="150" r="18" fill="#fff7e6"/>
  <circle cx="320" cy="150" r="18" fill="#fff7e6"/>
  <!-- music note -->
  <g fill="#ffffff">
    <circle cx="392" cy="142" r="22"/>
    <rect x="408" y="70" width="12" height="80"/>
    <path d="M408 70 q40 6 36 40 q-14 -22 -36 -16 z"/>
  </g>
</svg>
